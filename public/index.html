<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RRR Production ERP</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"></head><body>
<section id="loginView" class="login"><div class="login-card"><div class="logo"><div class="mark">RRR</div><div>Production ERP</div></div><h1>Welcome back</h1><p>Pre-inventory production control — fabric to warehouse handover.</p><form id="loginForm"><div class="field"><label>EMPLOYEE ID</label><input id="userId" autocomplete="username" placeholder="e.g. DK001"></div><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••"></div><button class="btn primary">Login</button><p id="loginError"></p></form></div></section>
<section id="appView" class="app hidden"><aside class="sidebar"><div class="brand">RRR Production<small>PRE-INVENTORY ERP · v0.6</small></div><nav id="nav" class="nav"></nav><div class="side-user"><b id="sideName"></b><small id="sideRole"></small><button id="logoutBtn" class="btn ghost" style="margin-top:10px;width:100%">Logout</button></div></aside><main class="main"><header class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="top-actions"><span id="syncStatus" class="status">● Ready</span><button id="refreshBtn" class="refresh-btn" title="Refresh current screen">↻ <span>Refresh</span></button></div></header><div id="stage" class="stage"></div></main></section>
<div id="operationHud" class="operation-hud hidden"><span class="op-spinner"></span><div><b id="operationTitle">Working…</b><small id="operationSub">Please wait</small></div></div><div id="toastHost" class="toast-host"></div><div id="modal" class="modal hidden"><div class="modal-card"><div id="modalBody"></div></div></div><script type="module" src="/app.js"></script></body></html>
